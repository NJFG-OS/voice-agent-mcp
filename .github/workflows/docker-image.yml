# ONE workflow builds the image. It replaces docker-image.yml, docker-publish.yml
# and publish.yml: those three pushed 0.2.0, 1.0.0 and 1.0.1 from the same
# Dockerfile, so no build ever produced the tag the app pins.
#
# The tag here must equal the tag the app pins (POD_IMAGE in
# src/lib/runpod.server.js). Bump both together.
name: docker-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - start_all.sh
      - .github/workflows/docker-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/njfg-os/voice-agent-mcp:0.2.1
